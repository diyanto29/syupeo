<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 590" width="94mm" height="59mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
    <!-- Background Gradient Clean Crisp White -->
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="voucherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="orangeGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Bleed & Background Area (94mm x 59mm) -->
  <rect width="940" height="590" fill="url(#bgBack)" />

  <!-- Background Subtle Accent -->
  <circle cx="920" cy="570" r="140" fill="#FF8A00" opacity="0.04" />
  <circle cx="20" cy="20" r="100" fill="#10B981" opacity="0.04" />

  <!-- Crop Marks (Garis Potong Percetakan 90 x 55 mm) -->
  <g stroke="#CBD5E1" stroke-width="1" opacity="0.8">
    <line x1="20" y1="0" x2="20" y2="12" />
    <line x1="0" y1="20" x2="12" y2="20" />
    <line x1="920" y1="0" x2="920" y2="12" />
    <line x1="940" y1="20" x2="928" y2="20" />
    <line x1="20" y1="590" x2="20" y2="578" />
    <line x1="0" y1="570" x2="12" y2="570" />
    <line x1="920" y1="590" x2="920" y2="578" />
    <line x1="940" y1="570" x2="928" y2="570" />
  </g>

  <!-- CONTENT SAFE ZONE (Trim 20..920, 20..570) -->
  <g transform="translate(50, 42)">

    <!-- HEADER: Subtitle & Offline Badge -->
    <g transform="translate(0, 0)">
      <text x="0" y="24" class="font-sans" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="-0.3">
        Kenapa Ratusan UMKM Memilih Mangga POS?
      </text>
      <!-- Offline Badge -->
      <rect x="680" y="2" width="160" height="30" rx="8" fill="#FEF3C7" stroke="#FDE68A" stroke-width="1" />
      <text x="760" y="22" class="font-sans" font-size="12" font-weight="800" fill="#B45309" text-anchor="middle">
        ⚡ 100% BISA OFFLINE
      </text>

      <line x1="0" y1="46" x2="840" y2="46" stroke="#E2E8F0" stroke-width="1.5" />
    </g>

    <!-- 2 FEATURE HIGHLIGHT BOXES -->
    <g transform="translate(0, 64)">
      <!-- Feature Box 1: Bebas Lemot & Offline -->
      <rect x="0" y="0" width="405" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#boxShadow)" />
      <g transform="translate(18, 20)">
        <!-- Icon -->
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#ECFDF5" />
        <text x="17" y="23" class="font-sans" font-size="18" text-anchor="middle">⚡</text>
        <!-- Title & Desc -->
        <text x="46" y="20" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Transaksi Lancar Tanpa Lemot</text>
        <text x="46" y="44" class="font-sans" font-size="12" font-weight="600" fill="#64748B">Kasir tetap jalan cepat walau koneksi</text>
        <text x="46" y="62" class="font-sans" font-size="12" font-weight="600" fill="#64748B">internet warung mati mendadak.</text>
      </g>

      <!-- Feature Box 2: Stok Otomatis & Laba -->
      <rect x="435" y="0" width="405" height="110" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#boxShadow)" />
      <g transform="translate(453, 20)">
        <!-- Icon -->
        <rect x="0" y="0" width="34" height="34" rx="8" fill="#FFF7ED" />
        <text x="17" y="23" class="font-sans" font-size="18" text-anchor="middle">📊</text>
        <!-- Title & Desc -->
        <text x="46" y="20" class="font-sans" font-size="15" font-weight="800" fill="#0F172A">Stok &amp; Laba Ritel / F&amp;B Akurat</text>
        <text x="46" y="44" class="font-sans" font-size="12" font-weight="600" fill="#64748B">Stok barang &amp; bahan resep dipotong</text>
        <text x="46" y="62" class="font-sans" font-size="12" font-weight="600" fill="#64748B">otomatis setiap ada penjualan kasir.</text>
      </g>
    </g>

    <!-- PROMO VOUCHER BANNER (Green Emerald Gradient) -->
    <g transform="translate(0, 195)" filter="url(#boxShadow)">
      <rect x="0" y="0" width="840" height="120" rx="16" fill="url(#voucherGrad)" />

      <!-- Left Voucher Info -->
      <g transform="translate(24, 24)">
        <text x="0" y="20" class="font-sans" font-size="13" font-weight="800" fill="#A7F3D0" letter-spacing="1">
          KLAIM VOUCHER KHUSUS PENGGUNA BARU:
        </text>
        <!-- Voucher Code Box -->
        <rect x="0" y="32" width="280" height="42" rx="10" fill="#FFFFFF" />
        <text x="140" y="60" class="font-sans" font-size="22" font-weight="900" fill="#059669" text-anchor="middle" letter-spacing="2">
          COBAMANGGA
        </text>
      </g>

      <!-- Right Voucher Benefit -->
      <g transform="translate(320, 26)">
        <text x="0" y="20" class="font-sans" font-size="16" font-weight="800" fill="#FFFFFF">
          🎁 GRATIS 30 HARI VIP ACCESS
        </text>
        <text x="0" y="44" class="font-sans" font-size="13" font-weight="600" fill="#ECFDF5">
          • Tanpa syarat kartu kredit / biaya tersembunyi
        </text>
        <text x="0" y="64" class="font-sans" font-size="13" font-weight="600" fill="#ECFDF5">
          • Gratis dibantu input 20 menu produk pertama Anda!
        </text>
      </g>
    </g>

    <!-- BOTTOM SECTION: OFFICIAL CS SUPPORT & CHANNELS -->
    <g transform="translate(0, 335)">
      <!-- Box CS Support Official -->
      <rect x="0" y="0" width="840" height="145" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />

      <!-- Support Header -->
      <text x="24" y="32" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">
        💬 Butuh Bantuan Panduan, Setup Printer, atau Klaim Voucher?
      </text>

      <!-- Contact Items Row -->
      <g transform="translate(24, 52)">

        <!-- Item 1: WhatsApp CS Resmi -->
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="260" height="58" rx="10" fill="#FFFFFF" stroke="#D1FAE5" stroke-width="1.5" />
          <circle cx="28" cy="29" r="16" fill="#10B981" />
          <!-- Phone/WA icon -->
          <text x="28" y="35" class="font-sans" font-size="14" fill="#FFFFFF" text-anchor="middle">WA</text>
          <text x="56" y="24" class="font-sans" font-size="11" font-weight="700" fill="#64748B">WhatsApp CS Bantuan:</text>
          <text x="56" y="46" class="font-sans" font-size="15" font-weight="900" fill="#059669">0856-2427-7920</text>
        </g>

        <!-- Item 2: Website Portal -->
        <g transform="translate(280, 0)">
          <rect x="0" y="0" width="260" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
          <circle cx="28" cy="29" r="16" fill="#0F172A" />
          <text x="28" y="35" class="font-sans" font-size="12" fill="#FFFFFF" text-anchor="middle">WEB</text>
          <text x="56" y="24" class="font-sans" font-size="11" font-weight="700" fill="#64748B">Website Resmi:</text>
          <text x="56" y="46" class="font-sans" font-size="14" font-weight="800" fill="#0F172A">mudahkan.online</text>
        </g>

        <!-- Item 3: Admin Web -->
        <g transform="translate(560, 0)">
          <rect x="0" y="0" width="232" height="58" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
          <circle cx="28" cy="29" r="16" fill="#FF8A00" />
          <text x="28" y="35" class="font-sans" font-size="12" fill="#FFFFFF" text-anchor="middle">POS</text>
          <text x="56" y="24" class="font-sans" font-size="11" font-weight="700" fill="#64748B">Portal Web Admin:</text>
          <text x="56" y="46" class="font-sans" font-size="12" font-weight="800" fill="#FF6B00">adminmanggapos...</text>
        </g>

      </g>

      <!-- Operational hours note -->
      <text x="24" y="132" class="font-sans" font-size="11" font-weight="700" fill="#94A3B8">
        Layanan Bantuan CS: Senin - Minggu (08.00 - 21.00 WIB) • Siap Bantu Panduan Sampai Toko Lancar
      </text>
    </g>

  </g>
</svg>
