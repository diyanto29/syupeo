<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 940 590" width="94mm" height="59mm">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&amp;display=swap');
      .font-sans { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
    </style>
    <!-- Background Gradient -->
    <linearGradient id="bgFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1E" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFA800" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadowBox" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Bleed & Background Area (94mm x 59mm) -->
  <rect width="940" height="590" fill="url(#bgFront)" />

  <!-- Background Decorative Curved Shapes -->
  <path d="M-50,0 Q200,-50 350,150 T-20,400 Z" fill="#FF8A00" opacity="0.08" />
  <circle cx="900" cy="80" r="220" fill="#10B981" opacity="0.10" />
  <circle cx="100" cy="550" r="180" fill="#FF8A00" opacity="0.08" />

  <!-- Crop Marks (Garis Potong Percetakan 90 x 55 mm) -->
  <g stroke="#64748B" stroke-width="1" opacity="0.6">
    <!-- Top-Left -->
    <line x1="20" y1="0" x2="20" y2="12" />
    <line x1="0" y1="20" x2="12" y2="20" />
    <!-- Top-Right -->
    <line x1="920" y1="0" x2="920" y2="12" />
    <line x1="940" y1="20" x2="928" y2="20" />
    <!-- Bottom-Left -->
    <line x1="20" y1="590" x2="20" y2="578" />
    <line x1="0" y1="570" x2="12" y2="570" />
    <!-- Bottom-Right -->
    <line x1="920" y1="590" x2="920" y2="578" />
    <line x1="940" y1="570" x2="928" y2="570" />
  </g>

  <!-- CONTENT SAFE ZONE (Trim 20..920, 20..570) -->
  <g transform="translate(50, 45)">

    <!-- HEADER: Logo & Brand Name -->
    <g transform="translate(0, 0)">
      <!-- Mango Fruit Icon SVG -->
      <g transform="translate(0, 4) scale(0.9)">
        <!-- Mango Body -->
        <path d="M22,8 C36,-2 48,12 44,28 C40,44 26,52 14,46 C2,40 -2,24 6,14 C10,9 16,5 22,8 Z" fill="url(#orangeGrad)" />
        <!-- Leaf -->
        <path d="M24,8 C28,0 38,0 42,4 C42,10 36,14 28,12 Z" fill="#10B981" />
      </g>

      <!-- Brand Typography -->
      <text x="56" y="34" class="font-sans" font-size="30" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">MANGGA POS</text>
      <text x="58" y="52" class="font-sans" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">BY MUDAHKAN.ONLINE</text>

      <!-- VIP Free Badge -->
      <rect x="610" y="8" width="230" height="36" rx="18" fill="url(#greenGrad)" />
      <text x="725" y="32" class="font-sans" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">GRATIS COBA LANGSUNG</text>
    </g>

    <!-- DIVIDER LINE -->
    <line x1="0" y1="78" x2="840" y2="78" stroke="#334155" stroke-width="1.5" />

    <!-- MAIN BODY LEFT: Punchy Headlines & Bullet Points -->
    <g transform="translate(0, 115)">
      <text x="0" y="24" class="font-sans" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
        Aplikasi Kasir Praktis &amp;
      </text>
      <text x="0" y="60" class="font-sans" font-size="28" font-weight="900" fill="url(#orangeGrad)" letter-spacing="-0.5">
        Anti Boncos untuk Toko Anda!
      </text>

      <!-- 3 Key Value Points -->
      <g transform="translate(0, 95)">
        <!-- Point 1 -->
        <circle cx="14" cy="14" r="12" fill="#10B981" opacity="0.2" />
        <text x="14" y="20" class="font-sans" font-size="15" font-weight="900" fill="#10B981" text-anchor="middle">✓</text>
        <text x="36" y="21" class="font-sans" font-size="16" font-weight="700" fill="#E2E8F0">Cetak Struk Bluetooth Cepat &amp; Praktis</text>

        <!-- Point 2 -->
        <circle cx="14" cy="48" r="12" fill="#10B981" opacity="0.2" />
        <text x="14" y="54" class="font-sans" font-size="15" font-weight="900" fill="#10B981" text-anchor="middle">✓</text>
        <text x="36" y="55" class="font-sans" font-size="16" font-weight="700" fill="#E2E8F0">Bebas Tambah Kasir Tanpa Biaya Extra</text>

        <!-- Point 3 -->
        <circle cx="14" cy="82" r="12" fill="#10B981" opacity="0.2" />
        <text x="14" y="88" class="font-sans" font-size="15" font-weight="900" fill="#10B981" text-anchor="middle">✓</text>
        <text x="36" y="89" class="font-sans" font-size="16" font-weight="700" fill="#E2E8F0">Laporan Omset &amp; Untung Bersih Harian di HP</text>
      </g>
    </g>

    <!-- MAIN BODY RIGHT: High-Contrast Scannable QR Code -->
    <g transform="translate(580, 100)" filter="url(#shadowBox)">
      <!-- White QR Container Card -->
      <rect x="0" y="0" width="260" height="310" rx="20" fill="#FFFFFF" />

      <!-- Real QR Code Image from Play Store URL -->
      <image href="https://api.qrserver.com/v1/create-qr-code/?size=200x200&amp;data=https://play.google.com/store/apps/details?id=online.mudahkan.manggapos&amp;margin=6" 
             x="30" y="24" width="200" height="200" />

      <!-- QR Instructions -->
      <text x="130" y="248" class="font-sans" font-size="13" font-weight="800" fill="#0F172A" text-anchor="middle">
        Scan Pakai Kamera HP
      </text>
      <text x="130" y="268" class="font-sans" font-size="11" font-weight="700" fill="#64748B" text-anchor="middle">
        Download di Google Play Store
      </text>
      <!-- Shortlink badge -->
      <rect x="40" y="278" width="180" height="22" rx="6" fill="#F1F5F9" />
      <text x="130" y="294" class="font-sans" font-size="11" font-weight="800" fill="#FF6B00" text-anchor="middle">
        s.id/manggapos
      </text>
    </g>

    <!-- FOOTER BAR: Official Domains & Play Store App ID -->
    <g transform="translate(0, 465)">
      <text x="0" y="20" class="font-sans" font-size="13" font-weight="700" fill="#38BDF8">
        ▶ Google Play: online.mudahkan.manggapos
      </text>
      <text x="450" y="20" class="font-sans" font-size="13" font-weight="700" fill="#94A3B8" text-anchor="end">
        Portal Admin: adminmanggapos.mudahkan.online
      </text>
    </g>

  </g>
</svg>
